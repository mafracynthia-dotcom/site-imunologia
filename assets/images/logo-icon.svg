<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Gradiente Fundo Teal Médico -->
    <linearGradient id="tealGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#126867"/>
      <stop offset="50%" stop-color="#0D5C5B"/>
      <stop offset="100%" stop-color="#083E3D"/>
    </linearGradient>

    <!-- Gradiente Dourado Nobre -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C799"/>
      <stop offset="50%" stop-color="#C09A67"/>
      <stop offset="100%" stop-color="#9E7645"/>
    </linearGradient>

    <!-- Sombra Suave -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Escudo / Base Circular com Borda Dourada -->
  <rect x="6" y="6" width="88" height="88" rx="26" fill="url(#tealGradient)" filter="url(#softGlow)"/>
  <rect x="8" y="8" width="84" height="84" rx="24" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" stroke-opacity="0.85"/>

  <!-- Cruz Médica Sutil no Fundo -->
  <path d="M50 24 V76 M24 50 H76" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.15" stroke-linecap="round"/>

  <!-- Arco de Proteção Imune (Escudo Superior) -->
  <path d="M26 38 C 36 28, 64 28, 74 38" fill="none" stroke="url(#goldGradient)" stroke-width="2" stroke-linecap="round"/>

  <!-- Anticorpo Central (Y) Estilizado - Símbolo Supremo da Imunologia -->
  <!-- Haste Central (Fc) -->
  <line x1="50" y1="52" x2="50" y2="75" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="50" y1="53" x2="50" y2="74" stroke="url(#goldGradient)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Braço Esquerdo (Fab) -->
  <path d="M50 52 C 46 44, 38 38, 33 34" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M50 52 C 46 44, 38 38, 33 34" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Braço Direito (Fab) -->
  <path d="M50 52 C 54 44, 62 38, 67 34" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M50 52 C 54 44, 62 38, 67 34" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Nódulos / Sítios de Ligação de Antígeno (Dourados) -->
  <circle cx="33" cy="34" r="4.5" fill="url(#goldGradient)" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="67" cy="34" r="4.5" fill="url(#goldGradient)" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="50" cy="52" r="3.5" fill="#FFFFFF"/>
  <circle cx="50" cy="75" r="3.5" fill="url(#goldGradient)"/>

  <!-- Monograma Elegante "IP" Integrado na Base -->
  <path d="M37 81 h4 M39 77 v8 M44 85 v-8 h4 c2.5 0 3.5 1 3.5 2.5 s-1 2.5-3.5 2.5 h-4" fill="none" stroke="url(#goldGradient)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
</svg>
